kind: 'Fixed'
body: 'fixed `autoupdate .` upgrading only the one language langforge reads first in the checkout, and only when it was Go, JavaScript, Python or Dart: a Terraform repository stopped with `unsupported project type: terraform`, a Dockerfile, pipeline, Java, C# or Ruby repository the same way, and a Go repository that also carried Terraform modules, Dockerfiles or CI pipelines had them silently left behind while `autoupdate run` upgraded all of them; local mode now upgrades every ecosystem it finds in the checkout on disk, below the root too, with the updaters `autoupdate run` uses, on one branch and in one pull request -- the primary language keeps its dedicated upgrade, a checkout holding only that ecosystem gets the same branch and pull request as before, and any other checkout, a Go repository with Terraform beside it included, now gets `chore/autoupdate-YYYY-MM-DD` as in batch mode'
