kind: 'Fixed'
body: 'fixed the new compile guard reading a stale vendor tree instead of the module graph. `go vet` is a build command, so in a module with a vendor directory and a `go` directive of 1.14 or above the toolchain defaults to `-mod=vendor` and runs the vendor-consistency check first - and `go get -u` has already rewritten `go.mod` while `go mod vendor` does not run until after the guard, so the tree is stale by construction. Every vendored module would have been judged broken on every run, its indirect upgrades held back and re-tidied away, under a log line blaming a direct dependency. The check now passes `-mod=readonly`, which asks about the module graph the vendor tree is about to be regenerated from, and keeps the predicate from rewriting the manifests the before-state probe has swapped out'
