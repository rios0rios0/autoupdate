kind: 'Added'
body: 'added a report of newer major versions the Go updater structurally cannot apply. Go publishes v2 and above under a different module path (`/v2`, `/v3`, ...), so `go get -u` never reaches one and a dependency could sit majors behind while every run called the repository up to date. Each direct requirement is now probed for the next major and any hit is listed in the pull request description, with the version in use beside it - existence decided on the version list rather than the exit status, because `go list -m -versions` answers successfully with an empty list for a major that was never published. It reports and never applies: crossing a major means rewriting imports and fixing whatever the new API renamed, which is a migration somebody decides to make rather than a diff a bot produces unattended'
