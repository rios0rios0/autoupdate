kind: 'Fixed'
body: 'stopped a target repository re-enabling stale-branch cleanup. `--skip-cleanup` is applied to the resolved settings before the repository''s own layer is folded, so a `.autoupdate.yaml` carrying `cleanup_stale_branches: true` was overriding the flag and deleting the branches the operator had reached for it to keep. That key is now honoured from a repository only when it is `false`: off can only ever remove an action. Also guarded `ApplyRepoOverlay` against the nil settings `autoupdate .` deliberately keeps working with, which any non-empty repository file would otherwise have dereferenced, and stopped validating the provider list outside batch mode — local mode takes its provider from the repository''s own `origin` remote and never reads it, so refusing a run over an entry it will not touch cost that run its updaters and exclusions too.'
time: '2026-08-29T04:00:07.291643041Z'
