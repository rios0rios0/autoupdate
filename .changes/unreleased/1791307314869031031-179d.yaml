kind: 'Changed'
body: 'changed every changelog statement about upgraded dependencies to name them: a run now lists each dependency it moved with the version on both sides (for example `golang.org/x/mod` from `v0.40.0` to `v0.41.0`), at most five to a line, instead of `changed the Go module dependencies to their latest versions`, which named nothing and which the exact-match de-duplication then dropped on every later run of a release cycle. A dependency the pending `[Unreleased]` section or a pending chlog fragment already names is updated where it is, keeping the version the last release shipped and taking the new one, rather than being named a second time. The Go, Terraform, Dockerfile and pipeline updaters name what they moved; a manifest that cannot be read falls back to the generic sentence, and a run that moved nothing declared writes a summary only when nothing else is pending'
