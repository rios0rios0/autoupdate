kind: 'Fixed'
body: 'fixed `autoupdate run` filling the disk of the machine it runs on as it moved through an organization: each repository now gets one working directory holding its clone and everything its package managers write outside it (the Go module and build caches with any downloaded Go toolchain, the npm, pnpm, Yarn, corepack, pip, PDM, Gradle, Maven, pub, NuGet and Bundler caches, and every temporary file), and the directory is deleted as soon as the repository is done, whether a pull request was opened, nothing needed upgrading or an updater failed; the deletion also removes Go''s read-only module cache, which `os.RemoveAll` left behind without reporting it, and the sweep of directories left by a killed run now covers every updater'
time: '2026-10-07T19:13:08.033113895Z'
