kind: 'Fixed'
body: 'fixed the report files this project''s pipeline writes being left untracked-but-unignored, where a `git add -A` could sweep them into a commit. `make test` alone drops `cobertura.xml`, `coverage.txt`, `coverage.xml` and `junit.xml` into the repository root, and `make sast` adds `.codeql-db/`; ten of the twelve paths the shared block names were ignored by nothing (`reports/` and `build/reports/` were already covered by this project''s own unanchored entries). They are now covered by the shared block `make gitignore` generates from [rios0rios0/pipelines](https://github.com/rios0rios0/pipelines), so the list is maintained where those filenames are decided rather than copied here by hand. The project''s own entries are untouched and sit below the block, where gitignore''s last-match-wins rule lets them override anything it says'
