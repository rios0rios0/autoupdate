kind: 'Fixed'
body: 'fixed the report files this project pipeline writes being left untracked-but-unignored, where a `git add -A` could sweep them into a commit. `make test` alone drops `cobertura.xml`, `coverage.txt`, `coverage.xml` and `junit.xml` into the repository root, and `make sast` adds `reports/` and `.codeql-db/`; none of the eleven was ignored. They are now covered by the shared block `make gitignore` generates from [rios0rios0/pipelines](https://github.com/rios0rios0/pipelines), so the list is maintained where those filenames are decided rather than copied here by hand. The project own entries are untouched and sit below the block, where gitignore last-match-wins rule lets them override anything it says'
