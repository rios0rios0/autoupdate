kind: 'Added'
body: 'added an optional registry check for the container images Terragrunt files pin by bare name (`api_image = "api:1.4.0"`): an `image_registries` rule in the operator configuration names the registry the files under some paths pull from, and a pin there then only moves to a tag that registry holds, trying the next tag down when the newest is missing and leaving the pin alone when the registry cannot be asked. It speaks the OCI Distribution API over HTTPS and reads credentials where `docker login` keeps them (`DOCKER_AUTH_CONFIG`, `$DOCKER_CONFIG` or `~/.docker/config.json`, and the credential helpers they name), never from the AutoUpdate configuration. Only the operator configuration may set `image_registries`, so a repository being updated cannot point the check, and the credentials it sends, at another host'
time: '2026-11-23T23:31:45.696836676Z'
