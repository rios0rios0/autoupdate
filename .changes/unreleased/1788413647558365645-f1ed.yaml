kind: 'Added'
body: 'taught the Ruby updater to widen Gemfile constraints so majors can actually resolve. Bundler has no flag meaning `raise the bounds in the Gemfile` -- `bundle update` resolves inside whatever is declared and `--major` only lifts bundler''s own ceiling -- so `gem "rails", "~> 6.0"` stayed on 6.x for ever however `allow_major_updates` was set. Ruby was the only ecosystem left without a way to honour the allowing direction, because every other one has a native answer: `pub upgrade --major-versions`, `pdm --unconstrained`, `pnpm update --latest`, `npm-check-updates`. The rewrite converts exactly one thing, `~> X.Y[.Z]` to `>= X.Y[.Z]`, which keeps the floor the repository declared -- the minimum its code needs -- and drops only the implicit ceiling that is the pessimistic operator''s whole purpose. Exact pins are left alone, being the same kind of statement as a `.ruby-version` file; explicit `<` and `<=` bounds are left alone, being the repository saying no in as many words; and only the `Gemfile` is touched, never a `.gemspec`, whose constraints describe what consumers of the library must tolerate rather than what this application may resolve to. It runs before `bundle update`, so the lockfile is resolved against the widened bounds rather than the ceiling that was just removed, and the constraint change lands in the diff next to the `Gemfile.lock` change -- the same contract `pub upgrade --major-versions` offers for `pubspec.yaml`.'
