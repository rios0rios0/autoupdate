kind: 'Added'
body: 'taught the Ruby updater to raise Gemfile constraints past a major so `allow_major_updates` can actually resolve one. Bundler has no flag meaning `raise the bounds in the Gemfile` -- `bundle update` resolves inside whatever is declared and `--major` only lifts bundler''s own ceiling -- so `gem "rails", "~> 6.0"` stayed on 6.x for ever however the key was set, while every other ecosystem had a native answer: `pub upgrade --major-versions`, `pdm --unconstrained`, `pnpm update --latest`, `npm-check-updates`. The rewrite works in two moves around `bundle update`: every pessimistic (`~>`) constraint on a `gem` line is widened to `>=` before the resolution so bundler may cross the major, and re-tightened afterwards to `~>` the version that resolved, at the precision the repository wrote -- `~> 6.0` becomes `~> 7.1`, and a constraint whose gem stayed inside its bound is put back untouched. The manifest therefore keeps stating a bound, which is the same contract `pub upgrade --major-versions` and `npm-check-updates` honour, and turning the key off again holds the repository where it is. When the widened resolution fails the manifest is restored and `bundle update` retried within the declared bounds, so a conflict degrades to the smaller upgrade rather than to a dropped ceiling beside a stale lockfile. Exact pins and explicit `<` bounds are left alone, being the repository saying no in as many words; the `ruby` directive, commented-out declarations and bundler plugins are never touched, because the rewrite is anchored on the `gem` call rather than on the operator; and only the `Gemfile` is rewritten, never a `.gemspec`, whose constraints describe what consumers of the library must tolerate rather than what this application may resolve to. The generated pull request description names the raised constraints and asks the reviewer to check them.'
