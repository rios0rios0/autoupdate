kind: 'Security'
body: 'stopped batch mode from adding a GitLab CI job''s `CI_JOB_TOKEN` to git''s credentials for a repository on another GitLab server than the one the job runs on: gitforge recognises GitLab by a substring of the URL, so a self-managed runner''s job token was offered to gitlab.com when the provider token failed. The job token now goes only to `CI_SERVER_HOST` (else `CI_SERVER_URL`''s host), and nowhere when neither is set'
time: '2026-11-20T16:19:48.195786576Z'
