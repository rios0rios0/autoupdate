kind: 'Fixed'
body: 'fixed the Terraform updater versioning an image pin by the first repository carrying the image name, which pinned the tags of a Helm chart named after the image (`0.3.0` for an image built only up to `0.0.4`); a repository with a `Chart.yaml` at its root is no longer an image source, a `Dockerfile` or `Containerfile` settles a choice between several, and an image no single repository builds is left alone. Tags are also ordered as numbers, so a four-part tag such as `0.26.0.5` no longer wins by string comparison'
time: '2026-11-23T23:31:45.701161346Z'
