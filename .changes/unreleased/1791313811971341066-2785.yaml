body: 'changed the JavaScript updater to name the packages it moves in the changelog, at the version on both sides: the packages `package.json` declares, at the versions `package-lock.json` (v1 to v3, workspaces included), `pnpm-lock.yaml` (v5 to v9) or `yarn.lock` (Classic or Berry) resolves, alongside the `.nvmrc` and `.node-version` pin; the standalone run now writes the changelog after the upgrade, and the changelog staging that only that run still used was removed'
