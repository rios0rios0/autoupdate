kind: 'Fixed'
body: 'stopped selecting pre-releases and cross-major upgrades. Two ecosystems were taking a version the feed called newest without checking it was a finished release, or one the repository could survive. Maven has no notion of a pre-release -- `3.0.0-beta3`, `7.1.0-M1`, `5.5-beta2` and `5.7-alpha1` are ordinary releases to it, `allowSnapshots=false` excludes none of them, and `maven-metadata.xml` reports the newest of them as `<release>` -- so a single run moved four security pins onto pre-releases at once, and the log4j2 one dropped `log4j-api` back to a transitive 2.24.1 and reintroduced the three CVEs the pin existed to remediate. Both Maven goals now pass `-Dmaven.version.ignore` and `-DallowMajorUpdates=false`. Go crossed a major instead: `go get -u` will not reach for a `/v2` path, but v0 and v1 share the unsuffixed one, so an indirect `gobwas/glob` went v0.2.3 to v1.0.0, the major removed the `Glob` interface every published `gocolly/colly` still declares, and the module stopped compiling -- inside a pull request whose title claimed a routine update. The generated script now snapshots the requirements before the upgrade and holds anything whose major moved, keeping every other upgrade in the run rather than abandoning it. The pre-release vocabulary is defined once, in `internal/support/prerelease.go`, so the Go side and the Maven regexes cannot disagree.'
