kind: 'Added'
body: 'validated `aggregate_branch_prefix` before anything uses it. The prefix decides which branches stale-branch cleanup deletes, and an operator''s typo is as capable of a mass deletion as a hostile repository would be, so it must name a branch git accepts, must contain a `/`, and must not stop at one — `chore/` matches AutoBump''s `chore/bump-*` branches, which is how one tool ends up deleting another''s branches and closing its pull requests. A bad prefix fails at startup, before a single branch has been listed.'
