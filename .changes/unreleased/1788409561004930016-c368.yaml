kind: 'Changed'
body: 'made the major-version guard configurable and turned it off by default. `allow_major_updates` is settable in any layer, including the target repository''s own `.autoupdate.yaml`, and an unset value now means majors are taken. The guard shipped unconditional, which had it backwards: a dependency held back is a dependency whose CVEs are never remediated, and the fix for a serious one is often only in the next major -- Spring Framework 6.2.x carried six unpatched advisories, four of them 9.8, whose only remedy was 7.0.x, and no 6.2 release ever shipped one. Refusing the major there does not avoid risk, it accumulates it silently. What catches a breaking change instead is the pipeline the pull request already runs: an incompatible major arrives as a red check on a branch rather than as a broken main, which is a more accurate signal than a version-number heuristic that cannot tell a rename from a rewrite. `java` passes the value through as `-DallowMajorUpdates` on both versions-maven-plugin goals; `golang` emits the guard only when it is false, so the generated script carries no bash function it will not call. Unlike `cleanup_stale_branches` the key is accepted in both directions from a repository''s own file: it starts nothing and destroys nothing, and a repository declining majors is declining upgrades for itself. The pre-release filter is unchanged and unaffected -- a beta is never a candidate, whatever this is set to, because taking one is how CVEs get reintroduced rather than remediated.'
