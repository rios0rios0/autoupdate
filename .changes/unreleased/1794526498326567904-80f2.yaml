kind: 'Fixed'
body: 'fixed `autoupdate run` taking a small machine past its memory when it processed several Go repositories at once: applying the Go updater is a build, since the compile guard and every prepared major migration type-check the module, and the go command already compiles one package per CPU, so builds side by side gained little and needed the memory of all of them, while modules sharing a large dependency graph each compiled all of it instead of finding it in the shared build cache; a run now starts only as many Go builds at once as the machine has room for, one per 4 GiB of the memory the process may use (on Linux the limit of its control group, which is how CI agents and containers size a job), at most one per CPU and never fewer than one'
