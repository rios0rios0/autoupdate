kind: 'Changed'
body: 'completed `allow_major_updates` across every updater. `dockerfile` refused every major unconditionally, which made it the only one whose answer no configuration could change -- a Dockerfile on `node:20` stayed on 20 for ever, including past its end of life. With majors allowed its two version-distance rules now fall away together, because crossing a major implies crossing a minor and keeping the patch-pin rule would leave a three-part pin unable to move at all; suffix and precision still have to match, since those encode what the Dockerfile chose rather than how far behind it is. `javascript`, `python` and the gem half of `ruby` could not cross a major at all: `npm update`, `pnpm update`, `yarn upgrade`, `pdm update` and `bundle update` all resolve inside the ranges the manifest already declares, so the policy of taking the newest release was never delivered for them. Each needed a different mechanism -- `pnpm update --latest`, `pdm update --unconstrained`, `npm-check-updates` fetched through `npx` with a fallback to the plain update when it cannot be reached, and for yarn a run-time choice between Berry''s `up` and Classic''s `upgrade --latest` because nothing on the Go side knows which is installed. Ruby is the asymmetric one: bundler has no flag meaning `raise the Gemfile bounds`, and rewriting a `~>` is a different act from resolving within it, so only the refusing direction is expressed -- `bundle update --minor` caps the bump that plain `bundle update` would otherwise take on an unconstrained gem, which is the direction that was actually missing.'
