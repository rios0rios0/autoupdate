kind: 'Fixed'
body: 'fixed the chlog fragments autoupdate writes, which were not shaped like the ones `chlog new` writes: the encoder chose a style per field, so `kind` and `body` came out as plain scalars whenever they happened not to need quoting, and `time` came out as a bare YAML timestamp — a `!!timestamp` where chlog had written a `!!str`. A repository filing entries through both tools therefore collected fragments in two shapes, with two different YAML types under the same key, and anything reading them more strictly than a Go struct decoder failed on autoupdate''s alone. Every scalar is now single-quoted and the timestamp is pre-formatted as RFC3339 with nanoseconds in UTC, so the file is byte for byte what `chlog new` produces'
