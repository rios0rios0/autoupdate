kind: 'Fixed'
body: 'fixed the global settings being read out of the repository being updated. The config search checked the working directory before the home one, and `autoupdate .` runs with the target repository as the working directory. A target repository may carry its own `.autoupdate.yaml` -- the same file name, but a different schema: a `skip`/`reason` opt-out rather than the global settings. That file was therefore loaded as the whole configuration, yielding no projects, no updaters and no tokens, and the run carried on with downloaded defaults instead of reporting that it had read the wrong file. The operator home directory is now searched first and on its own, through gitforge `FindGlobalConfigFile`; the previous wider search is kept as a fallback, so an operator who keeps no config in their home directory -- and therefore has no operator-level settings to lose -- sees no change. The lookup moved into its own `resolveConfigPath` so the decision can be tested without reading a file or reaching the network'
