kind: 'Changed'
body: 'changed the Python, Dart, Ruby, Java and C# updaters to name the dependencies they move in the changelog, at the version on both sides, instead of one generic sentence per release cycle: the `requirements.txt` pins or the versions `pdm.lock` resolves for the packages `pyproject.toml` declares, the direct dependencies `pubspec.lock` resolves, the gems the Gemfile names, the artifacts `pom.xml` declares and the Gradle wrapper version, and the `PackageReference`/`PackageVersion` versions of every C# project, alongside each language''s version pin; the Python and Dart standalone runs now write the changelog after the upgrade instead of staging it before'
