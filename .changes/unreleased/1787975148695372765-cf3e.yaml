kind: 'Added'
body: 'layered the configuration. AutoUpdate now folds four sources, each overriding only the keys its own document declares: the built-in defaults it ships with (embedded in the binary, so it knows every updater it supports with no configuration and no network), the same file fetched from `main` on a best effort, the operator''s own file, and the `.autoupdate.yaml` inside the repository being updated. Only the operator''s file may name a credential, a `providers` list or the aggregate branch prefix; the other three decode through a schema that has no field for them, so those keys have nowhere to land rather than being caught by a check that has to run at the right moment.'
