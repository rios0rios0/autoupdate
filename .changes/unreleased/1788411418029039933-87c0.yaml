kind: 'Fixed'
body: 'wired `allow_major_updates` into the ecosystems that were accepting it and ignoring it. It reached `java` and `golang` when it was introduced; `dart`, `terraform`, `pipeline`, `csharp` and `ruby` took the key through the configuration layers and then dropped it. Dart was the worst of those because it did not merely ignore the setting, it did the opposite: `pub upgrade --major-versions` is precisely a request to raise constraints across majors, and it was passed unconditionally, so a repository committing `allow_major_updates: false` had its constraints raised anyway with nothing in the log saying so. The four version-comparing updaters now go through `support.AcceptsUpgrade`, which is `IsNewerVersion` plus the major question asked together, so an ecosystem cannot answer one and forget the other -- `terraform`, `pipeline`, `csharp` and `ruby` previously took every major unconditionally. `javascript`, `python` and the gem half of `ruby` are untouched: they delegate to a package manager that already resolves inside the declared ranges, so there is nothing for the key to gate, and making them cross majors would be a new capability rather than a wiring job. `dockerfile` is also untouched, for the opposite reason -- it refuses every major unconditionally, so honouring the key there means relaxing a rule that predates it, which is a behaviour decision rather than a gap. The README, the shipped config and CLAUDE.md now name exactly which updaters honour it and why the rest do not.'
