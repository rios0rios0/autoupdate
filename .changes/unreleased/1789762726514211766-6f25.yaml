kind: 'Fixed'
body: 'stopped the Go updater opening pull requests whose modules no longer compile for a reason nobody chose: `go get -u` raises indirect requirements past what anything in the graph asks for, and when the module they belong to must move in step with another, an untagged dependency''s pseudo-version breaks the build while moving no major, no minor and nothing a version comparison can catch. Every Go module is now verified with `go vet ./...` after the upgrade - not `go build ./...`, which compiles nothing and exits zero for a module whose only Go files are tests - and a module the upgrade stopped compiling has the indirect requirements this run raised held back, keeping every direct upgrade. It never reverts an upgrade: when holding those back is not enough the cause is a direct dependency, which is a real breaking change, so it ships and the pull request fails CI rather than being silently dropped - reverting would leave an empty branch and, in a single-module repository, no pull request at all'
