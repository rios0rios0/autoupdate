# AutoUpdate's built-in defaults.
#
# This is the first of the four configuration layers, and the only one that is always
# present: it is compiled into the binary with `go:embed`, and the same file is served
# from `main` so an installed binary can pick up a change without a release.
#
#   built-in defaults -> published defaults -> your ~/.autoupdate.yaml -> the target repository's .autoupdate.yaml
#
# Each layer overrides only the keys it declares, so everything below is a starting point
# rather than a decision. It is NOT a template to copy: it deliberately carries no
# credentials, no `providers` and no `aggregate_branch_prefix`, because those are yours to
# set and this file is merged into every run. Start from
# `configs/autoupdate.example.yaml` instead.

# (optional) delete the dated branches left over by earlier runs, closing any pull request
# attached to them, before creating the branch for the current run. Enabled by default.
#cleanup_stale_branches: false

# (optional) number of repositories processed in parallel within an organization.
# Omit it (or set 0) for the built-in default of 4; 1 processes them sequentially.
#concurrency: 4

# (optional) skip forked or archived repositories.
#exclude_forks: true
#exclude_archived: true

# All updaters are enabled by default with auto_complete disabled.
# Users only need to override specific fields; omitted fields keep these defaults.
# The entire updaters section can be omitted to use all defaults.
updaters:
  terraform:
    enabled: true
    auto_complete: false
  golang:
    enabled: true
    auto_complete: false
  python:
    enabled: true
    auto_complete: false
  javascript:
    enabled: true
    auto_complete: false
  ruby:
    enabled: true
    auto_complete: false
  java:
    enabled: true
    auto_complete: false
  csharp:
    enabled: true
    auto_complete: false
  dart:
    enabled: true
    auto_complete: false
  pipeline:
    enabled: true
    auto_complete: false
  dockerfile:
    enabled: true
    auto_complete: false
