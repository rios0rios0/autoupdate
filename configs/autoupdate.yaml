# autoupdate configuration
# Tokens can be set inline, via environment variable references (${VAR}),
# or as a path to a file containing the token.

providers:
  - type: github
    token: "${GITHUB_TOKEN}"
    organizations:
      - "my-org"

  # - type: azuredevops
  #   token: "${AZURE_DEVOPS_PAT}"
  #   organizations:
  #     - "https://dev.azure.com/MyOrg"

  # - type: gitlab
  #   token: "${GITLAB_TOKEN}"
  #   organizations:
  #     - "my-group"

# Delete the dated branches left over by earlier runs, closing any pull request
# attached to them, before creating the branch for the current run. The aggregate
# branch carries the run date, so without this an unattended daily run leaves one
# abandoned branch per day for as long as nobody merges.
# Enabled by default, so set it to false to keep those branches, or pass
# --skip-cleanup to disable it for a single run.
#cleanup_stale_branches: true

# Prefix of the consolidated branch each run creates; the run date is appended to
# it. The same prefix decides which branches the cleanup above removes.
#aggregate_branch_prefix: 'chore/autoupdate-'

# Number of repositories to process in parallel within an organization.
# Repository processing is I/O-bound (clone + remote API calls), so a small
# fan-out shortens large-organization runs significantly. Omit it (or set 0)
# to use the built-in default of 4; set 1 to process repositories sequentially.
# The --concurrency CLI flag, when provided, overrides this value.
# concurrency: 4

# Skip specific repositories globally. Patterns are right-anchored
# against <org>/<repo> (or <org>/<project>/<repo> on Azure DevOps), and
# support `path.Match`-style globs (`*`, `?`, `[...]`) that do not cross
# "/". A bare name matches the trailing segment of the key.
# exclude_repos:
#   - 'my-org/legacy-monorepo'
#   - '*/sandbox'

# All updaters are enabled by default with auto_complete disabled.
# Users only need to override specific fields; omitted fields keep these defaults.
# The entire updaters section can be omitted to use all defaults.
updaters:
  terraform:
    enabled: true
    auto_complete: false
  golang:
    enabled: true
    auto_complete: false
  python:
    enabled: true
    auto_complete: false
  javascript:
    enabled: true
    auto_complete: false
  ruby:
    enabled: true
    auto_complete: false
  java:
    enabled: true
    auto_complete: false
  csharp:
    enabled: true
    auto_complete: false
  pipeline:
    enabled: true
    auto_complete: false
  dockerfile:
    enabled: true
    auto_complete: false
